server.port=8001
spring.application.name=auth-service

spring.data.mongodb.uri=${DB_URL}
spring.data.mongodb.database=travelmgmt

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Google OAuth - from environment
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8001/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.org.springframework=INFO
logging.level.com.travelmgmt=DEBUG