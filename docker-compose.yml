version: '3.8'

networks:
  travel-network:
    driver: bridge

services:

  zookeeper:
    image: zookeeper:3.7
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - travel-network

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - travel-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - travel-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8181:8181"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - travel-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - eureka-server
    networks:
      - travel-network

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - travel-network

  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8084:8084"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - travel-network

  chat-service:
    build: ./chat-service
    container_name: chat-service
    ports:
      - "8085:8085"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
    depends_on:
      - eureka-server
      - kafka
    networks:
      - travel-network

  site-service:
    build: ./site-service
    container_name: site-service
    ports:
      - "8083:8083"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - travel-network

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "8086:8086"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
    depends_on:
      - eureka-server
      - kafka
    networks:
      - travel-network

  image-service:
    build: ./image-service
    container_name: image-service
    ports:
      - "8087:8087"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - travel-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8088:8088"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DB_URL=${DB_URL}
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      - eureka-server
      - kafka
    networks:
      - travel-network

  travel-frontend:
    build: ./travel-frontend
    container_name: travel-frontend
    networks:
      - travel-network
    depends_on:
      - api-gateway

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-gateway
      - travel-frontend
    networks:
      - travel-network