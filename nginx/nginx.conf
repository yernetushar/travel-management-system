upstream api_gateway {
    server api-gateway:8181;
}

upstream frontend {
    server travel-frontend:80;
}

server {
    listen 80;
    server_name localhost;

    # ===========================
    # FRONTEND - React App
    # ===========================
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # React Router support
        try_files $uri $uri/ /index.html;
    }

    # ===========================
    # AUTH SERVICE - port 8001
    # ===========================
    location /api/auth/ {
        proxy_pass http://api_gateway/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # ===========================
    # GOOGLE OAUTH
    # ===========================
    location /oauth2/ {
        proxy_pass http://api_gateway/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /login/oauth2/ {
        proxy_pass http://api_gateway/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ===========================
    # USER SERVICE - port 8082
    # ===========================
    location /api/users/ {
        proxy_pass http://api_gateway/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ===========================
    # SITE SERVICE - port 8083
    # ===========================
    location /api/sites/ {
        proxy_pass http://api_gateway/api/sites/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;

        # File upload support
        client_max_body_size 10M;
    }

    # ===========================
    # BOOKING SERVICE - port 8084
    # ===========================
    location /api/bookings/ {
        proxy_pass http://api_gateway/api/bookings/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ===========================
    # CHAT SERVICE - port 8085
    # WebSocket support
    # ===========================
    location /api/chat/ {
        proxy_pass http://api_gateway/api/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/chat/ws {
        proxy_pass http://api_gateway/api/chat/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===========================
    # ANALYTICS SERVICE - port 8086
    # ===========================
    location /api/analytics/ {
        proxy_pass http://api_gateway/api/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ===========================
    # IMAGE SERVICE - port 8087
    # ===========================
    location /api/images/ {
        proxy_pass http://api_gateway/api/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;

        # Large file upload support
        client_max_body_size 20M;
    }

    # ===========================
    # NOTIFICATION SERVICE - port 8088
    # ===========================
    location /api/notifications/ {
        proxy_pass http://api_gateway/api/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # =====================