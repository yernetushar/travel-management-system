name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push eureka-server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest ./eureka-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest

      - name: Build and Push api-gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and Push auth-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest ./auth-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Build and Push user-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest ./user-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest

      - name: Build and Push booking-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/booking-service:latest ./booking-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/booking-service:latest

      - name: Build and Push site-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/site-service:latest ./site-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/site-service:latest

      - name: Build and Push chat-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest ./chat-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest

      - name: Build and Push analytics-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest ./analytics-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest

      - name: Build and Push image-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/image-service:latest ./image-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/image-service:latest

      - name: Build and Push notification-service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest ./notification-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: travel-frontend/package-lock.json

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travel-frontend:latest ./travel-frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/travel-frontend:latest

      - name: All Services Pushed Successfully
        run: echo "✅ All Docker images built and pushed to DockerHub!"